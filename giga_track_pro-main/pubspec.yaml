name: trackerapp
description: Giga Track Pro vehicle tracking application.

publish_to: "none"

version: 2.0.12+26

environment:
  sdk: ">=3.9.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.9
  another_flushbar: ^2.2.4
  sliding_up_panel: ^2.0.0+1
  getwidget: ^7.0.0
  shimmer: ^3.0.0
  animated_marker: ^0.3.0

  # State Management
  provider: ^6.1.5+1

  # Networking
  http: ^1.6.0

  # Local Storage
  shared_preferences: ^2.5.5

  sqflite: ^2.4.2+1
  path_provider: ^2.1.5
  path: ^1.9.1
  flutter_cache_manager: ^3.4.1

  # Maps & Location
  google_maps_flutter: ^2.17.0
  google_maps_flutter_web: ^0.6.2
  google_maps_flutter_platform_interface: ^2.15.0
  geolocator: ^14.0.2
  maps_launcher: ^3.0.0+1
  fluster: ^1.2.0

  # Firebase
  firebase_core: ^4.7.0
  firebase_messaging: ^16.2.0

  # Notifications
  flutter_local_notifications: ^22.0.1

  # Machine Learning
  google_mlkit_translation: ^0.14.0

  # Text To Speech
  flutter_tts: ^4.2.5

  # Charts & PDF
  syncfusion_flutter_charts: ^34.1.30
  pdfrx: ^2.2.24

  # Utilities
  fluttertoast: ^9.1.0
  timezone: ^0.11.0
  url_launcher: ^6.3.2
  share_plus: ^13.2.0
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/appicon.png"
  min_sdk_android: 21

flutter:
  config:
    enable-swift-package-manager: false

  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/ios/